{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reciclaje{% endblock %}</title>
</head>
<body style="background-color: #8ecbe9;">
    <header>
        <div style="background-color: #178508; padding: 1px; border: 2px solid #000000; border-radius: 15px; display: inline-block;"> 
            <h1> 
                <span style="color: rgb(241, 243, 241);">ECO</span> 
                <img src="{% static 'Reciclaje/img/OIG3.webp' %}" alt="Logo" style="height: 40px; vertical-align: middle; margin: 0 5px;">
                <span style="color: rgb(241, 243, 241);">VECINOS</span> 
            </h1>
        </div>
    </header>

    <main>  
        {% block content %}{% endblock %}
        {% block mapa %}{% endblock %}
    </main>
</body>
</html>

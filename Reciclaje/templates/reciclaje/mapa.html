{% extends "reciclaje/base.html" %}

{% block title %}ECOVECINOS{% endblock %}

{% block content %}
    <h2><span style="color: #dae2da; margin-top: 10px;">Bienvenido a la página de reciclaje</span></h2>
    <p style="color: #ffffff; margin-top: 10px;">pues chad no?</p>
{% endblock %}

<!-- todo lo que es el mapa -->

{% block mapa %}
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@mapbox/mapbox-gl-geocoder@5.0.1/dist/mapbox-gl-geocoder.css" type="text/css" />

<style>
    #map {
        height: 500px;
        width: 50%;
    }
    #marker_popup {
        color: #000000
    }
</style>

<div id="map"></div> <!-- este div tiene todo el mapa dentro -->

<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<script src="https://unpkg.com/@mapbox/mapbox-gl-geocoder@5.0.1/dist/mapbox-gl-geocoder.min.js"></script>

<script>
    const maxDist = 4 // distancia maxima de puntos limpios (km)

    mapboxgl.accessToken = 'pk.eyJ1IjoidG9wYXoyMjIwIiwiYSI6ImNtdnBwcjk0OTAxNTYyenExZ2JkZG5vZXcifQ.ddSZ_pK1T0Tv3YqOhEWXGQ';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/standard',
        zoom: 10,
        center: [-70.647827, -33.459204],
    });

    const geocoder = new MapboxGeocoder({
        accessToken: mapboxgl.accessToken,
        mapboxgl: mapboxgl,
        marker: true,
        placeholder: 'Buscar dirección',
        countries: 'cl'
    });

    map.addControl(geocoder);

    let apiMarkers = [];

    function clearApiMarkers() {
        apiMarkers.forEach(marker => marker.remove());
        apiMarkers = [];
    }

    geocoder.on('result', async (e) => {
        const [lng, lat] = e.result.geometry.coordinates;

        clearApiMarkers();

        try {
            const apiUrl = `http://127.0.0.1:8000/puntoslimpios?lat=${lat}&long=${lng}&dist=${maxDist}`;
            const response = await fetch(apiUrl);
            const data = await response.json();

            data.forEach(item => {
                const itemLngLat = [item.lng, item.lat];

                const popup = new mapboxgl.Popup({ offset: 4 })
                    .setHTML(`
                    <div id="marker_popup">
                    <h3>${item.address_name}</h3>
                    <p>${item.address_number || ''}</p>
                    <p>${parseFloat(item.dist).toFixed(1)}km</p>
                    </div>
                    `);

                const marker = new mapboxgl.Marker({ color: '#00ff00' })
                    .setLngLat(itemLngLat)
                    .setPopup(popup)
                    .addTo(map);

                apiMarkers.push(marker);
            });

        } catch (error) {
            console.error('No se han podido obtener los marcadores:', error);
        }
    });
</script>
{% endblock %}

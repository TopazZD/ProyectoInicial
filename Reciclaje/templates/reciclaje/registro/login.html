{% extends "reciclaje/base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<section class="pagina-auth">
    <div class="tarjeta-auth">
        <h2>¡Bienvenido de nuevo!</h2>
        <p class="auth-descripcion">
            Inicia sesión para seguir reciclando con ECOVECINOS.
        </p>
        <form method="post">
            {% csrf_token %}

            <div class="campos-auth">
                {{ form.as_p }}
            </div>

            <button type="submit" class="boton-auth">
                Iniciar sesión
            </button>
        </form>

        <p class="auth-enlace">
            ¿No tienes cuenta?
            <a href="{% url 'register' %}"> Regístrate aquí </a>
        </p>
    </div>
</section>

{% endblock %}
